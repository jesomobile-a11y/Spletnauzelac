name: Deploy to Domenca FTP

on:
  push:
    branches:
      - main
  workflow_dispatch: # omogoča tudi ročni zagon v zavihku Actions

jobs:
  web-deploy:
    name: Deploy Website
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps        # če Domenca FTPS ne podpira, spremenite v: ftp
          server-dir: /public_html/   # ali ustrezna mapa na Domenci
          exclude: |
            **/.git*
            **/.git*/**
            README.md
