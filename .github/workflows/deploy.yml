name: Deploy to Domenca FTP

on:
  # Samodejno nalaganje ob vsakem pushu je izklopljeno.
  # Za vklop odstranite znak # pred vrsticami push in branches:
  # push:
  #   branches:
  #     - main
  workflow_dispatch: # ročni zagon: Actions > Deploy to Domenca FTP > Run workflow

jobs:
  web-deploy:
    name: Deploy Website
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps        # če Domenca FTPS ne podpira, spremenite v: ftp
          server-dir: /   # FTP račun github@uzelac.si ima korensko mapo public_html
          exclude: |
            **/.git*
            **/.git*/**
            README.md
